#:schema https://mise.jdx.dev/schema/mise.json
# https://mise.jdx.dev/

[tools]
prek = "latest"
python = "3.14"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"

[tasks]
clean = "git clean -fdx"
install = "./install.sh"
check = "prek run --all-files"
update = "prek update --cooldown-days 7 --freeze"
venv.run = [
  "rm -rf .venv",
  "python3 -m venv .venv",
  ".venv/bin/pip install --requirement requirement.txt"
]
